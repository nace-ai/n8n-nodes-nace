# Build without npm publishing credentials or OIDC permission. Publish only the
# tested tarball in a separate job protected by the npm-publish environment.
#
# One-time setup:
# 1. Create the GitHub environment "npm-publish" and require reviewers.
# 2. Configure an npm trusted publisher for owner nace-ai, repository
#    n8n-nodes-nace, workflow publish.yml, environment npm-publish.
# 3. No NPM_TOKEN is required. The publish job uses GitHub OIDC and provenance.
#
# Push a version tag such as v0.1.0, or run this workflow manually. A manual run
# publishes the selected ref after checks and environment approval.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Pack tested package
        run: npm pack --pack-destination .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball
          path: n8n-nodes-nace-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball
          path: package
      - name: Publish tarball with provenance
        run: |
          set -- package/n8n-nodes-nace-*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ]
          npm publish "$1" --provenance --access public --ignore-scripts
